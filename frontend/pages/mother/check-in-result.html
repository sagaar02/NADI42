<body class="font-body-md text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar (Minimal for transactional flow, just back button and Nadi logo) -->
<header class="bg-surface/80 backdrop-blur-md text-primary sticky top-0 z-50 flex justify-between items-center px-margin-mobile md:px-lg py-4 w-full h-16 max-w-2xl mx-auto">

</a>
<div class="text-headline-md font-headline-md font-semibold text-primary tracking-tight">Nadi</div>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-md relative overflow-hidden">
<!-- Decorative Ambient Background -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center overflow-hidden z-0">
<div class="w-[800px] h-[800px] bg-amber-soft rounded-full opacity-30 blur-[120px] animate-pulse-slow"></div>
</div>
<div class="relative z-10 w-full max-w-md flex flex-col items-center text-center space-y-lg">
<!-- Risk Badge -->
<div id="risk-badge" class="nadi-status-badge nadi-status-amber">Assessment Complete</div>
<!-- Breathing Visual Element -->
<div class="relative w-40 h-40 flex items-center justify-center mb-4">
<!-- Outer Glow -->
<div class="absolute inset-0 bg-tertiary-fixed rounded-full opacity-40 blur-2xl animate-breathe" style="animation-duration: 5s;"></div>
<!-- Middle Layer -->
<div class="absolute inset-4 bg-tertiary-fixed rounded-full opacity-60 blur-xl animate-breathe" style="animation-delay: 0.5s; animation-duration: 4.5s;"></div>
<!-- Core Indicator -->
<div class="relative w-24 h-24 bg-tertiary-fixed-dim rounded-full shadow-[0_4px_20px_rgba(225,162,60,0.3)] flex items-center justify-center">
<span class="material-symbols-outlined text-[48px] text-on-tertiary-container" style="font-variation-settings: 'FILL' 1;">
                        favorite
                    </span>
</div>
</div>
<!-- Header & Message -->
<div class="space-y-4 px-4">
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg text-on-surface">
                    Let's keep an eye on this.
                </h1>
<p class="text-body-lg font-body-lg text-on-surface-variant max-w-sm mx-auto">
                    Your answers suggest that a follow-up may be helpful. Your ASHA can check in with you to see how you're feeling.
                </p>
</div>

<div class="w-full flex flex-col space-y-3 mt-6 px-4">

<span class="material-symbols-outlined text-[20px]">dashboard</span>

</a>
<a href="/pages/mother/timeline.html" class="w-full bg-surface-container text-on-surface py-3.5 px-6 rounded-xl text-label-md font-label-md border border-outline-variant/30 hover:bg-surface-container-high transition-all active:scale-[0.98] flex items-center justify-center space-x-2">
<span class="material-symbols-outlined text-[20px]">event_note</span>
