<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nadi Check-in</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="/css/styles.css" />

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f2fcf5",

                        "tertiary-container": "#5b3b00",
                        "secondary-fixed-dim": "#89d6ae",
                        "primary": "#003325",
                        "on-tertiary-container": "#e1a23c",
                        "surface-container-low": "#ecf6ef",
                        "surface-container": "#e6f0e9",
                        "tertiary-fixed": "#ffddb1",
                        "surface-container-high": "#e0ebe4",
                        "on-error-container": "#93000a",
                        "surface-dim": "#d2dcd6",
                        "inverse-surface": "#29322e",
                        "inverse-on-surface": "#e9f3ec",
                        "on-tertiary-fixed-variant": "#624000",
                        "surface": "#f2fcf5",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#9ed1bc",
                        "surface-tint": "#376756",
                        "on-secondary-fixed-variant": "#005236",
                        "on-secondary-fixed": "#002113",
                        "error": "#ba1a1a",

                        "on-primary-fixed": "#002117",
                        "on-error": "#ffffff",
                        "surface-variant": "#dbe5de",
                        "primary-fixed": "#b9eed7",
                        "outline-variant": "#c0c9c3",
                        "on-tertiary-fixed": "#291800",
                        "on-background": "#141d1a",
                        "tertiary-fixed-dim": "#fdba52",
                        "secondary-container": "#a4f3c9",
                        "on-primary-fixed-variant": "#1d4f3f",
                        "inverse-primary": "#9ed1bc"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",

                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "64px",
                        "xs": "8px",

                        "margin-mobile": "16px",
                        "gutter": "24px",

                        "base": "4px"
                    },
                    "fontFamily": {
                        "body-lg": ["Plus Jakarta Sans"],

<style>
        .progress-bar-fill {
            transition: width 0.8s ease-in-out;
            width: 60%; /* 3/5 */
        }
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
  </head>
<body class="bg-surface text-on-surface font-body-md h-full flex flex-col antialiased">
<!-- Top Navigation for Linear Journey (Back / Close) -->
<header class="flex justify-between items-center px-margin-mobile md:px-lg py-sm w-full bg-transparent max-w-2xl mx-auto">
<a href="/pages/mother/dashboard.html" aria-label="Go back" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-low hover:bg-surface-container text-on-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</a>
<a href="/pages/mother/dashboard.html" aria-label="Save and close" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-low text-on-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</a>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile md:px-lg max-w-2xl mx-auto w-full pt-lg pb-xl">
<!-- Question -->
<div class="mb-lg space-y-md">
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg text-primary tracking-tight">
                How is your bleeding today?
            </h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">
                Take your time to reflect on any changes since yesterday.
            </p>
</div>
<!-- Options Container -->
<form id="check-in-form" class="space-y-md w-full flex-grow flex flex-col justify-center">
<!-- Option 1 -->
<label class="option-card group relative flex items-center p-md rounded-2xl bg-surface-container-lowest border border-surface-container-high shadow-sm hover:border-secondary hover:shadow-md cursor-pointer transition-all duration-300">
<input class="peer sr-only" name="bleeding_status" type="radio" value="normal"/>
<div class="radio-circle w-6 h-6 rounded-full border-2 border-outline-variant group-has-[:checked]:border-secondary group-has-[:checked]:bg-secondary flex items-center justify-center mr-md transition-colors">
<span class="check-icon material-symbols-outlined text-on-secondary text-[16px] opacity-0 group-has-[:checked]:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="option-title text-headline-md font-headline-md text-primary group-has-[:checked]:text-secondary transition-colors">
                    Normal
                </span>
</label>
<!-- Option 2 -->
<label class="option-card group relative flex items-center p-md rounded-2xl bg-surface-container-lowest border border-surface-container-high shadow-sm hover:border-secondary hover:shadow-md cursor-pointer transition-all duration-300">
<input class="peer sr-only" name="bleeding_status" type="radio" value="more"/>
<div class="radio-circle w-6 h-6 rounded-full border-2 border-outline-variant group-has-[:checked]:border-secondary group-has-[:checked]:bg-secondary flex items-center justify-center mr-md transition-colors">
<span class="check-icon material-symbols-outlined text-on-secondary text-[16px] opacity-0 group-has-[:checked]:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="option-title text-headline-md font-headline-md text-primary group-has-[:checked]:text-secondary transition-colors">
                    More than yesterday
                </span>
</label>
<!-- Option 3 -->
<label class="option-card group relative flex items-center p-md rounded-2xl bg-surface-container-lowest border border-surface-container-high shadow-sm hover:border-secondary hover:shadow-md cursor-pointer transition-all duration-300">
<input class="peer sr-only" name="bleeding_status" type="radio" value="heavy"/>
<div class="radio-circle w-6 h-6 rounded-full border-2 border-outline-variant group-has-[:checked]:border-secondary group-has-[:checked]:bg-secondary flex items-center justify-center mr-md transition-colors">
<span class="check-icon material-symbols-outlined text-on-secondary text-[16px] opacity-0 group-has-[:checked]:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="option-title text-headline-md font-headline-md text-primary group-has-[:checked]:text-secondary transition-colors">
                    Very heavy
                </span>
</label>
<div class="rounded-2xl bg-surface-container-low p-md">
<div class="text-label-md font-label-md text-on-surface-variant mb-3">Do you have a fever today?</div>
<div class="flex gap-3">
<label class="flex-1 flex items-center gap-2 p-3 rounded-xl bg-surface-container-lowest border border-surface-container-high cursor-pointer">
<input class="accent-secondary" name="fever" type="radio" value="no" checked />
<span class="text-body-md font-body-md text-primary">No</span>
</label>
<label class="flex-1 flex items-center gap-2 p-3 rounded-xl bg-surface-container-lowest border border-surface-container-high cursor-pointer">
<input class="accent-secondary" name="fever" type="radio" value="yes" />
<span class="text-body-md font-body-md text-primary">Yes</span>
</label>
</div>
</div>
</form>
<!-- Continue Action (Shows when selected) -->
<div class="mt-lg flex justify-end opacity-0 pointer-events-none transition-opacity duration-300" id="continue-container">
<button id="continue-btn" type="button" class="bg-primary text-on-primary px-lg py-sm rounded-full text-label-md font-label-md flex items-center gap-2 hover:bg-secondary transition-colors shadow-lg shadow-[rgba(23,32,28,0.1)]">
                Continue
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</main>
<!-- Footer Progress Indicator -->
<footer class="w-full px-margin-mobile md:px-lg pb-lg pt-sm flex flex-col items-center justify-center bg-surface max-w-2xl mx-auto">
<div class="flex items-center justify-between w-full mb-xs">
<span class="text-label-md font-label-md text-on-surface-variant">03 / 05</span>
</div>
<div class="w-full h-2 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-secondary rounded-full progress-bar-fill shadow-[0_0_8px_rgba(24,107,75,0.4)]"></div>
</div>
</footer>
<script>
        // Show continue button when an option is selected
        document.querySelectorAll('input[name="bleeding_status"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const continueContainer = document.getElementById('continue-container');
                continueContainer.classList.remove('opacity-0', 'pointer-events-none');
                continueContainer.classList.add('opacity-100');
            });
        });
    </script>
<script src="/js/api.js"></script>
<script src="/js/demo-wiring.js"></script>
</body></html>
